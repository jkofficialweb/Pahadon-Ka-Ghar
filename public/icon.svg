<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="peakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="chaletGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#skyGrad)"/>

  <!-- Distant Snow Peaks -->
  <polygon points="120,290 220,120 320,290" fill="#cbd5e1" opacity="0.6"/>
  <polygon points="200,154 220,120 240,154 230,165 220,158 210,165" fill="#ffffff"/>

  <!-- Main Majestic Himalayan Peak (Mount Harmukh) -->
  <polygon points="190,340 330,80 470,340" fill="url(#peakGrad)"/>
  <polygon points="305,130 330,80 355,130 340,145 330,138 320,145" fill="#ffffff"/>
  <!-- Mountain Shadow Side -->
  <polygon points="330,80 470,340 330,340" fill="#64748b" opacity="0.35"/>

  <!-- Secondary Left Ridge -->
  <polygon points="40,360 170,160 300,360" fill="#94a3b8"/>
  <polygon points="150,195 170,160 190,195 180,205 170,200 160,205" fill="#ffffff"/>

  <!-- Pine Forest Belt -->
  <polygon points="90,380 110,330 130,380" fill="#065f46"/>
  <polygon points="115,370 135,315 155,370" fill="#047857"/>
  <polygon points="140,380 160,325 180,380" fill="#065f46"/>
  <polygon points="350,380 370,320 390,380" fill="#065f46"/>
  <polygon points="375,370 395,310 415,370" fill="#047857"/>

  <!-- Sindh River Torrent -->
  <path d="M 60,460 C 180,440 220,400 310,380 C 400,360 440,380 490,410 L 490,512 L 40,512 Z" fill="url(#riverGrad)" opacity="0.9"/>
  <path d="M 80,480 C 190,465 240,430 320,410 C 380,395 440,415 480,440" stroke="#a5f3fc" stroke-width="4" fill="none" opacity="0.75"/>

  <!-- Pahadon Ka Ghar Traditional Alpine Chalet -->
  <!-- Roof -->
  <polygon points="256,270 180,340 332,340" fill="url(#chaletGrad)"/>
  <!-- Overhang -->
  <line x1="170" y1="340" x2="342" y2="340" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>
  <!-- Chalet Body -->
  <rect x="200" y="340" width="112" height="75" fill="#78350f" rx="4"/>
  <!-- Timber Lines -->
  <line x1="200" y1="360" x2="312" y2="360" stroke="#92400e" stroke-width="2"/>
  <line x1="200" y1="380" x2="312" y2="380" stroke="#92400e" stroke-width="2"/>
  <line x1="200" y1="400" x2="312" y2="400" stroke="#92400e" stroke-width="2"/>
  <!-- Glowing Warm Windows -->
  <rect x="215" y="352" width="24" height="24" rx="3" fill="#fef3c7"/>
  <line x1="227" y1="352" x2="227" y2="376" stroke="#b45309" stroke-width="1.5"/>
  <line x1="215" y1="364" x2="239" y2="364" stroke="#b45309" stroke-width="1.5"/>
  <rect x="273" y="352" width="24" height="24" rx="3" fill="#fef3c7"/>
  <line x1="285" y1="352" x2="285" y2="376" stroke="#b45309" stroke-width="1.5"/>
  <line x1="273" y1="364" x2="297" y2="364" stroke="#b45309" stroke-width="1.5"/>
  <!-- Wooden Door -->
  <rect x="244" y="375" width="24" height="40" rx="3" fill="#451a03"/>
  <circle cx="262" cy="395" r="2" fill="#fbbf24"/>

  <!-- Morning Sun Star / Kahwa Warmth -->
  <circle cx="100" cy="110" r="28" fill="#fbbf24" opacity="0.9"/>
  <circle cx="100" cy="110" r="38" fill="#f59e0b" opacity="0.25"/>
</svg>
